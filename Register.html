<!DOCTYPE html>
<html lang="en">
<head>
<title>Register Page</title>
<style>
*{
margin: o;
padding: o;
box-sizing: border-box;
font-family: "poppins", serif:

}
body{
	display: flex;
	justify-content: center;
	align-items: center;
	min-height: 100vh;
	background: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet);
	color: #333;
}
.container{
	margin: 0 15px;
}
.form-box{
	width: 100%;
	max-width: 450px;
	background: linear-gradient(to down, red, orange, yellow, green, blue, indigo, violet);
	border-radius: 10px;
	box-shadow: 0 0 10px rgba(0,0,0,0.1);
	display: none;
}
.form-box.active{
	display: block;
}
h2{
	font-size: 34px;
	text-align: center;
	margin-bottom: 20px;
}
input, select{
	width: 100%;
	padding: 12px;
	background: #eee;
	border-radius:6px;
	border: none;
	outline: none;
	font-size: 16px;
	color: #333;
	margin-bottom: 20px;
}
button{
	width: 100%;
	padding: 12px;
	background: #7494ec;
	border-radius: 6px;
	border: none;
	cursor: pointer;
	font-size: 16px;
	color: #fff;
	font-weight: 500;
	margin-bottom: 20px;
	transition: 0.5s;
}
button:hover{
	background: #079993;
	color: #000;
}
p{
	font-size: 17.5px;
	text-align: center;
	margin-bottom: 10px;
	color: #fff;
}
p a{
	color: #7494ec;
	text-decoration: none;
}
p a:hover{
	text-decoration: underline;
}

</style>
</head>
<body>
<div class="container">
<div class="form-box active" id="register-form">
<form action="Login.html" method="post">
<h2>Register</h2> <?showError($erros['register']);?>
<input type="text" name="name" placeholder="Name" required>
<input type="email" name="email" placeholder="Email" required>
<input type="password" name="password" placeholder="Password" required>
<select name="role" required>
<option value="">--Select Role--</option>
<option value="user">User</option>
<option value="admin">Admin</option>
</select>
<button type="submit" name="register">Register</button>
<p>Already have an account?<a href="Login.html" onclick="showform('login form')">Login</a></p>
</div>
</div>
</body>
</html>
