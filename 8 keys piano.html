<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>8 keys Piano</title>

<style>
body {
margin: 0;
background: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet);
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
font-family: Arial, sans-serif;
}

/* Piano Container */
.piano {
display: flex;
position: relative;
}

/* White Keys */
.key.white {
width: 60px;
height: 240px;
background: white;
border: 1px solid #000;
box-sizing: border-box;
}

/* Black Keys */
.key.black {
width: 40px;
height: 150px;
background: black;
position: absolute;
top: 0;
z-index: 2;
}

/* Black key positions */
.black.csharp { left: 40px; }
.black.dsharp { left: 100px; }
.black.fsharp { left: 220px; }
.black.gsharp { left: 280px; }
.black.asharp { left: 340px; }

/* Active animation */
.key.active {
background: #f1c40f !important;
}
div{
color: #079993;
height: -100vh;
}
.key white{
color: #079993;
height: 100vh;
}
</style>
</head>


<body>

<div class="piano">
<!-- White Keys -->
<div class="key white" data-note="C">A</div>
<div class="key white" data-note="D">S</div>
<div class="key white" data-note="E">D</div>
<div class="key white" data-note="F">F</div>
<div class="key white" data-note="G">G</div>
<div class="key white" data-note="A">H</div>
<div class="key white" data-note="B">J</div>
<div class="key white" data-note="C2">K</div>
<!-- Black Keys -->
<div class="key black csharp" data-note="C#">W</div>
<div class="key black dsharp" data-note="D#">E</div>
<div class="key black fsharp" data-note="F#">T</div>
<div class="key black gsharp" data-note="G#">Y</div>
<div class="key black asharp" data-note="A#">U</div>
</div>

<script>
const audioContext = new (window.AudioContext || window.webkitAudioContext)();

const notes = {
"C": 261.63,
"C#": 277.18,
"D": 293.66,
"D#": 311.13,
"E": 329.63,
"F": 349.23,
"F#": 369.99,
"G": 392.00,
"G#": 415.30,
"A": 440.00,
"A#": 466.16,
"B": 493.88,
"C2": 522.28
};

function playNote(freq) {
const osc = audioContext.createOscillator();
const gain = audioContext.createGain();

osc.type = "sine";
osc.frequency.value = freq;

osc.connect(gain);
gain.connect(audioContext.destination);

osc.start();
gain.gain.setValueAtTime(1, audioContext.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.6);
osc.stop(audioContext.currentTime + 0.6);
}

document.querySelectorAll(".key").forEach(key => {
key.addEventListener("mousedown", () => {
const note = key.dataset.note;
playNote(notes[note]);
key.classList.add("active");
});

key.addEventListener("mouseup", () => {
key.classList.remove("active");
});

key.addEventListener("mouseleave", () => {
key.classList.remove("active");
});
});

// Keyboard mapping
const keyMap = {
"a": "C",
"w": "C#",
"s": "D",
"e": "D#",
"d": "E",
"f": "F",
"t": "F#",
"g": "G",
"y": "G#",
"h": "A",
"u": "A#",
"j": "B",
"k": "C2",
};

document.addEventListener("keydown", e => {
const note = keyMap[e.key];
if (note) {
playNote(notes[note]);
document.querySelector(`[data-note="${note}"]`).classList.add("active");
}
});

document.addEventListener("keyup", e => {
const note = keyMap[e.key];
if (note) {
document.querySelector(`[data-note="${note}"]`).classList.remove("active");
}
});
</script>

</body>
</html>
